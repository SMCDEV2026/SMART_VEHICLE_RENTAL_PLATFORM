<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Vehicle | DriveZone</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <h2> DriveZone</h2>
    </div>

    <nav>

        <a href="../index.html">Home</a>
        <a href="vehicles.html">Vehicles</a>
        <a href="my-bookings.html">My Bookings</a>

    </nav>

</header>


<section class="booking-section">

<div class="booking-container">

<h1>Book Your Vehicle</h1>

<p>
Fill the details below to continue booking.
</p>


<form id="bookingForm">

<div class="booking-grid">


<div class="input-box">

<label>Pickup Date</label>

<input type="date" id="pickupDate" required>

</div>


<div class="input-box">

<label>Return Date</label>

<input type="date" id="returnDate" required>

</div>


<div class="input-box">

<label>Pickup Time</label>

<input type="time" id="pickupTime" required>

</div>


<div class="input-box">

<label>Return Time</label>

<input type="time" id="returnTime" required>

</div>


<div class="input-box">

<label>Pickup Location</label>

<select id="pickupLocation" required>

<option value="">Select Location</option>

<option>Mumbai Airport</option>

<option>Thane</option>

<option>Navi Mumbai</option>

<option>Pune</option>

</select>

</div>


<div class="input-box">

<label>Return Location</label>

<select id="returnLocation" required>

<option value="">Select Location</option>

<option>Mumbai Airport</option>

<option>Thane</option>

<option>Navi Mumbai</option>

<option>Pune</option>

</select>

</div>


</div>


<div class="booking-summary">

<h2>Estimated Price</h2>

<h3 id="price">Loading...</h3>

<p>
Security Deposit :
<b id="deposit">Loading...</b>
</p>

<p>GST Included</p>

</div>


<button type="submit" class="btn">

Check Availability

</button>


</form>

</div>

</section>


<script>

document.addEventListener("DOMContentLoaded", async function () {

    const API =
        "https://smart-vehicle-rental-platform-1.onrender.com/api";


    const params =
        new URLSearchParams(window.location.search);


    const vehicleId =
        params.get("id");


    /*
        Make sure vehicle ID exists
    */

    if (!vehicleId) {

        document.getElementById("price").textContent =
            "Vehicle not selected";

        document.getElementById("deposit").textContent =
            "N/A";

        return;

    }


    /*
        Load vehicle information
    */

    try {

        const response =
            await fetch(`${API}/vehicles/${vehicleId}`);


        if (!response.ok) {

            throw new Error(
                "Unable to load vehicle"
            );

        }


        const vehicle =
            await response.json();


        /*
            Vehicle rental price
        */

        const price =
            Number(vehicle.price_per_day || 0);


        document.getElementById("price").textContent =
            `₹${price.toLocaleString("en-IN")} / Day`;


        /*
            Security deposit
        */

        const deposit =
            Number(vehicle.security_deposit || 0);


        document.getElementById("deposit").textContent =
            `₹${deposit.toLocaleString("en-IN")}`;


    }

    catch (error) {

        console.error(
            "Vehicle loading error:",
            error
        );


        /*
            Don't break the page
            if backend is temporarily unavailable.
        */

        document.getElementById("price").textContent =
            "Price unavailable";


        document.getElementById("deposit").textContent =
            "Contact support";

    }


    /*
        Booking form
    */

    document
        .getElementById("bookingForm")
        .addEventListener("submit", function (e) {

            e.preventDefault();


            const pickup =
                document.getElementById("pickupDate").value;


            const ret =
                document.getElementById("returnDate").value;


            const pickupTime =
                document.getElementById("pickupTime").value;


            const returnTime =
                document.getElementById("returnTime").value;


            const pickupLocation =
                document.getElementById("pickupLocation").value;


            const returnLocation =
                document.getElementById("returnLocation").value;


            /*
                Validate dates
            */

            if (ret < pickup) {

                alert(
                    "Return date cannot be before pickup date."
                );

                return;

            }


            /*
                Go to availability page
            */

            window.location.href =
                `availability.html?id=${vehicleId}` +
                `&pickup=${encodeURIComponent(pickup)}` +
                `&return=${encodeURIComponent(ret)}` +
                `&pickupTime=${encodeURIComponent(pickupTime)}` +
                `&returnTime=${encodeURIComponent(returnTime)}` +
                `&pickupLocation=${encodeURIComponent(pickupLocation)}` +
                `&returnLocation=${encodeURIComponent(returnLocation)}`;

        });

});


</script>


<script src="../assets/js/script.js"></script>


</body>

</html>
