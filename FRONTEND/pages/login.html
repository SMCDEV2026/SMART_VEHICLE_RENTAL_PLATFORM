<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DriveZone</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            <h2>DriveZone</h2>
        </div>

        <nav>

            <a href="../index.html">Home</a>
            <a href="vehicles.html">Vehicles</a>
            <a href="public/about.html">About</a>
            <a href="public/contact.html">Contact</a>

        </nav>

    </header>


    <!-- Login Section -->

    <section class="login-section">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p>Login to continue your booking.</p>


            <!-- Login Form -->

            <form id="loginForm">

                <!-- Email -->

                <div class="input-box">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Remember -->

                <div class="remember">

                    <label>

                        <input type="checkbox" id="rememberMe">

                        Remember Me

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn"
                    id="loginBtn">

                    Login

                </button>

            </form>


            <!-- Divider -->

            <div class="divider">

                <span>OR</span>

            </div>


            <!-- Google Login -->

            <button
                type="button"
                class="google-btn"
                id="googleLogin">

                <i class="fab fa-google"></i>

                Continue with Google

            </button>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <!-- JavaScript -->

    <script src="../assets/js/script.js"></script>

    <!-- Authentication -->

    <script src="../assets/js/auth.js"></script>

    <!-- Login Page JS -->

    <script src="../assets/js/login.js"></script>

<script src="../js/login.js"></script>s
</body>

</html>
