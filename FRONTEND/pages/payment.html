<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment | DriveZone</title>

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        .coupon-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            background: #151515;
            border: 1px solid #2d2d2d;
        }

        .coupon-box label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 17px;
        }

        .coupon-row {
            display: flex;
            gap: 12px;
        }

        .coupon-row input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 9px;
            border: 1px solid #444;
            background: #0e0e0e;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        .coupon-row input:focus {
            border-color: #ff7a00;
        }

        .coupon-row button {
            padding: 14px 24px;
            border: none;
            border-radius: 9px;
            background: #ff7a00;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .coupon-row button:hover {
            background: #ff8c1a;
        }

        .coupon-row button:disabled {
            opacity: 0.9;
            cursor: not-allowed;
        }

        #couponMessage {
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .coupon-success {
            color: #20df91;
        }

        .coupon-error {
            color: #ff5252;
        }

        .price-summary {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            background: #151515;
            border: 1px solid #2d2d2d;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            font-size: 16px;
        }

        .price-row.discount {
            color: #20df91;
            font-weight: 700;
        }

        .price-row.final {
            margin-top: 10px;
            padding-top: 16px;
            border-top: 1px solid #333;
            font-size: 22px;
            font-weight: 800;
            color: #ff7a00;
        }

        .discount-badge {
            display: inline-block;
            margin-left: 7px;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(32, 223, 145, 0.12);
            color: #20df91;
            font-size: 12px;
        }

        .available-coupons {
            margin-top: 12px;
            color: #999;
            font-size: 13px;
            line-height: 1.7;
        }

        .available-coupons strong {
            color: #ff7a00;
        }

        @media (max-width: 600px) {

            .coupon-row {
                flex-direction: column;
            }

            .coupon-row button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        <h2>DriveZone</h2>
    </div>

    <nav>

        <a href="../index.html">
            Home
        </a>

        <a href="vehicles.html">
            Vehicles
        </a>

        <a href="my-bookings.html">
            My Bookings
        </a>

    </nav>

</header>


<section class="payment-section">

    <div class="payment-container">

        <h1>
            Payment
        </h1>

        <p>
            Select your preferred payment method
        </p>


        <!-- TOTAL PAYABLE -->

        <div class="amount-box">

            <h2>
                Total Payable
            </h2>

            <h1 id="totalAmount">
                Loading...
            </h1>

        </div>


        <form id="paymentForm">


            <!-- PAYMENT METHODS -->

            <div class="payment-method">

                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="card"
                        checked>
                    💳 Credit / Debit Card
                </label>


                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="upi">
                    📱 UPI
                </label>


                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="netbanking">
                    🏦 Net Banking
                </label>


                <label>
                    <input
                        type="radio"
                        name="payment"
                        value="cash">
                    💵 Cash On Pickup
                </label>

            </div>


            <!-- COUPON -->

            <div class="coupon-box">

                <label for="couponCode">

                    <i class="fa-solid fa-ticket"></i>

                    Coupon Code

                </label>


                <div class="coupon-row">

                    <input
                        type="text"
                        id="couponCode"
                        placeholder="Enter Coupon Code"
                        autocomplete="off">


                    <button
                        type="button"
                        id="applyCouponBtn">

                        Apply

                    </button>

                </div>


                <div id="couponMessage"></div>


                <div class="available-coupons">

                    Available Coupons:

                    <br>

                    <strong>NEW25</strong>
                    → ₹4,000 OFF

                    <br>

                    <strong>LOYALTY</strong>
                    → ₹5,000 OFF

                    <br>

                    <strong>DRIVEZONE30</strong>
                    → ₹3,000 OFF

                </div>

            </div>


            <!-- PRICE SUMMARY -->

            <div class="price-summary">

                <div class="price-row">

                    <span>
                        Original Amount
                    </span>

                    <strong id="originalAmount">
                        ₹0
                    </strong>

                </div>


                <div
                    class="price-row discount"
                    id="discountRow"
                    style="display:none;">

                    <span>

                        Coupon Discount

                        <span
                            class="discount-badge"
                            id="discountBadge">

                            COUPON

                        </span>

                    </span>

                    <strong id="discountAmount">
                        - ₹0
                    </strong>

                </div>


                <div class="price-row final">

                    <span>
                        Final Payable
                    </span>

                    <strong id="finalAmount">
                        ₹0
                    </strong>

                </div>

            </div>


            <!-- PAY BUTTON -->

            <button
                type="submit"
                class="btn"
                id="payNowBtn">

                Pay Now

            </button>


        </form>

    </div>

</section>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const API =
        "https://smart-vehicle-rental-platform-1.onrender.com/api";

    const params = new URLSearchParams(window.location.search);

    /* ===============================
       BOOKING DATA
    =============================== */

    const vehicleId =
        params.get("id") ||
        params.get("vehicleId") ||
        "";

    const vehicleName =
        params.get("vehicleName") ||
        params.get("vehicle") ||
        "";

    const pickup =
        params.get("pickup") ||
        "";

    const returnDate =
        params.get("return") ||
        "";

    const pickupLocation =
        params.get("pickupLocation") ||
        params.get("location") ||
        "";

    const returnLocation =
        params.get("returnLocation") ||
        "";

    /* ===============================
       PASSED AMOUNTS
    =============================== */

    const passedTotal =
        Number(params.get("total")) || 0;

    const passedOriginal =
        Number(params.get("original")) || 0;

    const passedDiscount =
        Number(params.get("discount")) || 0;

    const passedCoupon =
        params.get("coupon") || "";

    /* ===============================
       PAYMENT VARIABLES
    =============================== */

    let originalTotal =
        passedOriginal > 0
            ? passedOriginal
            : passedTotal;

    let couponDiscount =
        passedDiscount > 0
            ? passedDiscount
            : 0;

    let finalPayable =
        passedTotal > 0
            ? passedTotal
            : originalTotal;

    let couponApplied =
        passedDiscount > 0;

    let appliedCouponCode =
        passedCoupon;

    /* ===============================
       COUPONS
    =============================== */

    const coupons = {
        NEW25: 4000,
        LOYALTY: 5000,
        DRIVEZONE30: 3000
    };

    /* ===============================
       ELEMENTS
    =============================== */

    const totalAmountEl =
        document.getElementById("totalAmount");

    const originalAmountEl =
        document.getElementById("originalAmount");

    const discountAmountEl =
        document.getElementById("discountAmount");

    const finalAmountEl =
        document.getElementById("finalAmount");

    const discountRow =
        document.getElementById("discountRow");

    const discountBadge =
        document.getElementById("discountBadge");

    const couponCodeEl =
        document.getElementById("couponCode");

    const couponMessageEl =
        document.getElementById("couponMessage");

    const applyCouponBtn =
        document.getElementById("applyCouponBtn");

    const paymentForm =
        document.getElementById("paymentForm");

    const payNowBtn =
        document.getElementById("payNowBtn");

    /* ===============================
       MONEY FORMAT
    =============================== */

    function formatMoney(amount) {

        return "₹" +
            Math.round(Number(amount) || 0)
                .toLocaleString("en-IN");
    }

    /* ===============================
       UPDATE PAYMENT UI
    =============================== */

    function updatePaymentUI() {

        finalPayable =
            Math.max(
                0,
                originalTotal - couponDiscount
            );

        originalAmountEl.textContent =
            formatMoney(originalTotal);

        discountAmountEl.textContent =
            "- " +
            formatMoney(couponDiscount);

        finalAmountEl.textContent =
            formatMoney(finalPayable);

        totalAmountEl.textContent =
            formatMoney(finalPayable);

        if (couponDiscount > 0) {

            discountRow.style.display = "flex";

            discountBadge.textContent =
                appliedCouponCode || "COUPON";

        } else {

            discountRow.style.display = "none";

        }
    }

    /* ===============================
       LOAD PAYMENT
    =============================== */

    async function loadPayment() {

        /* --------------------------------
           If total already came from
           Booking Summary, use it.
        -------------------------------- */

        if (passedTotal > 0) {

            originalTotal =
                passedOriginal > 0
                    ? passedOriginal
                    : passedTotal;

            couponDiscount =
                passedDiscount;

            finalPayable =
                Math.max(
                    0,
                    originalTotal - couponDiscount
                );

            updatePaymentUI();
        }

        /* --------------------------------
           If no total was passed,
           calculate from vehicle API.
        -------------------------------- */

        if (
            passedTotal <= 0 &&
            vehicleId &&
            pickup &&
            returnDate
        ) {

            try {

                const controller =
                    new AbortController();

                const timeout =
                    setTimeout(
                        function () {
                            controller.abort();
                        },
                        8000
                    );

                let response;

                try {

                    response =
                        await fetch(
                            API +
                            "/vehicles/" +
                            encodeURIComponent(vehicleId),
                            {
                                signal:
                                    controller.signal
                            }
                        );

                } finally {

                    clearTimeout(timeout);

                }

                if (!response.ok) {

                    throw new Error(
                        "Vehicle API error: " +
                        response.status
                    );
                }

                const vehicle =
                    await response.json();

                const pricePerDay =
                    Number(
                        vehicle.price_per_day
                    );

                const securityDeposit =
                    Number(
                        vehicle.security_deposit
                    ) || 0;

                if (
                    !Number.isFinite(pricePerDay) ||
                    pricePerDay <= 0
                ) {

                    throw new Error(
                        "Invalid vehicle price"
                    );
                }

                /* --------------------------------
                   DATE CALCULATION
                -------------------------------- */

                const startDate =
                    new Date(
                        pickup + "T00:00:00"
                    );

                const endDate =
                    new Date(
                        returnDate + "T00:00:00"
                    );

                if (
                    Number.isNaN(startDate.getTime()) ||
                    Number.isNaN(endDate.getTime()) ||
                    endDate < startDate
                ) {

                    throw new Error(
                        "Invalid booking dates"
                    );
                }

                const oneDay =
                    24 * 60 * 60 * 1000;

                const days =
                    Math.max(
                        1,
                        Math.ceil(
                            (
                                endDate.getTime() -
                                startDate.getTime()
                            ) / oneDay
                        )
                    );

                /* --------------------------------
                   RENT
                -------------------------------- */

                const rentalCharge =
                    days * pricePerDay;

                /* --------------------------------
                   GST
                -------------------------------- */

                const gst =
                    Math.round(
                        rentalCharge * 0.18
                    );

                /* --------------------------------
                   ORIGINAL TOTAL
                -------------------------------- */

                originalTotal =
                    Math.round(
                        rentalCharge +
                        securityDeposit +
                        gst
                    );

                couponDiscount = 0;
                couponApplied = false;
                appliedCouponCode = "";

                finalPayable =
                    originalTotal;

                updatePaymentUI();

                console.log(
                    "Payment calculated:",
                    {
                        vehicleId,
                        vehicleName,
                        pickup,
                        returnDate,
                        pickupLocation,
                        returnLocation,
                        days,
                        rentalCharge,
                        securityDeposit,
                        gst,
                        originalTotal,
                        finalPayable
                    }
                );

            }
            catch (error) {

                console.error(
                    "Payment loading error:",
                    error
                );

                totalAmountEl.textContent =
                    "Unable to load amount";
            }
        }

        /* --------------------------------
           No booking total and no data
        -------------------------------- */

        if (
            passedTotal <= 0 &&
            (!vehicleId || !pickup || !returnDate)
        ) {

            totalAmountEl.textContent =
                "Invalid Booking";
        }
    }

    /* ===============================
       APPLY COUPON
    =============================== */

    function applyCoupon() {

        const code =
            couponCodeEl.value
                .trim()
                .toUpperCase();

        if (!code) {

            couponMessageEl.className =
                "coupon-error";

            couponMessageEl.textContent =
                "Please enter a coupon code.";

            return;
        }

        if (originalTotal <= 0) {

            couponMessageEl.className =
                "coupon-error";

            couponMessageEl.textContent =
                "Please wait for the amount to load.";

            return;
        }

        if (
            !Object.prototype.hasOwnProperty.call(
                coupons,
                code
            )
        ) {

            couponDiscount = 0;
            couponApplied = false;
            appliedCouponCode = "";

            finalPayable =
                originalTotal;

            couponMessageEl.className =
                "coupon-error";

            couponMessageEl.textContent =
                "✕ Invalid coupon code. Try NEW25, LOYALTY or DRIVEZONE30.";

            updatePaymentUI();

            return;
        }

        couponDiscount =
            Math.min(
                coupons[code],
                originalTotal
            );

        couponApplied = true;

        appliedCouponCode = code;

        finalPayable =
            Math.max(
                0,
                originalTotal - couponDiscount
            );

        couponMessageEl.className =
            "coupon-success";

        couponMessageEl.textContent =
            "✓ Coupon " +
            code +
            " applied successfully! ₹" +
            couponDiscount.toLocaleString("en-IN") +
            " discount added.";

        couponCodeEl.disabled = true;

        applyCouponBtn.disabled = true;

        applyCouponBtn.textContent =
            "Applied";

        updatePaymentUI();
    }

    /* ===============================
       COUPON BUTTON
    =============================== */

    applyCouponBtn.addEventListener(
        "click",
        applyCoupon
    );

    /* ===============================
       PAYMENT SUBMIT
    =============================== */

    paymentForm.addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            if (finalPayable <= 0) {

                alert(
                    "Payment amount is not available. Please go back and try again."
                );

                return;
            }

            const selectedPayment =
                document.querySelector(
                    'input[name="payment"]:checked'
                );

            const paymentMethod =
                selectedPayment
                    ? selectedPayment.value
                    : "card";

            payNowBtn.disabled = true;

            payNowBtn.textContent =
                "Processing Payment...";

            /* ===============================
               PRESERVE ALL BOOKING DATA
            =============================== */

            const nextParams =
                new URLSearchParams();

            /* Vehicle ID */

            nextParams.set(
                "id",
                vehicleId
            );

            nextParams.set(
                "vehicleId",
                vehicleId
            );

            /* Vehicle Name */

            nextParams.set(
                "vehicleName",
                vehicleName
            );

            nextParams.set(
                "vehicle",
                vehicleName
            );

            /* Dates */

            nextParams.set(
                "pickup",
                pickup
            );

            nextParams.set(
                "return",
                returnDate
            );

            /* Locations */

            nextParams.set(
                "pickupLocation",
                pickupLocation
            );

            nextParams.set(
                "returnLocation",
                returnLocation
            );

            /* Money */

            nextParams.set(
                "original",
                String(
                    Math.round(originalTotal)
                )
            );

            nextParams.set(
                "discount",
                String(
                    Math.round(couponDiscount)
                )
            );

            nextParams.set(
                "coupon",
                couponApplied
                    ? appliedCouponCode
                    : ""
            );

            nextParams.set(
                "total",
                String(
                    Math.round(finalPayable)
                )
            );

            /* Payment method */

            nextParams.set(
                "payment",
                paymentMethod
            );

            console.log(
                "Sending booking data:",
                Object.fromEntries(
                    nextParams.entries()
                )
            );

            /* ===============================
               GO TO PROCESSING
            =============================== */

            setTimeout(
                function () {

                    window.location.href =
                        "processing.html?" +
                        nextParams.toString();

                },
                700
            );
        }
    );

    /* ===============================
       INITIAL LOAD
    =============================== */

    if (passedTotal > 0) {
        updatePaymentUI();
    }

    loadPayment();

});
</script>


<script src="../assets/js/script.js"></script>


</body>
</html>
