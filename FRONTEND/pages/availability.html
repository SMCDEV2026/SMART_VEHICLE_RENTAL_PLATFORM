<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Availability Check | DriveZone</title>

<link rel="stylesheet"
href="../assets/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>

<header>

<div class="logo">

<h2>DriveZone</h2>

</div>


<nav>

<a href="../index.html">Home</a>

<a href="vehicles.html">Vehicles</a>

<a href="my-bookings.html">My Bookings</a>

</nav>

</header>


<section class="availability-section">

<div class="availability-card">


<i class="fa-solid fa-circle-check success-icon"></i>


<h1>Vehicle Available</h1>


<p>

Great News! Your selected vehicle is available
for the selected dates.

</p>


<div class="booking-info">


<div>

<h3>Vehicle</h3>

<p id="vehicleName">Loading...</p>

</div>


<div>

<h3>Pickup Date</h3>

<p id="pickupDate">Loading...</p>

</div>


<div>

<h3>Return Date</h3>

<p id="returnDate">Loading...</p>

</div>


<div>

<h3>Total Days</h3>

<p id="totalDays">Loading...</p>

</div>


<div>

<h3>Total Amount</h3>

<p class="price"
id="totalAmount">Loading...</p>

</div>


</div>


<a id="continueBtn"
href="#"
class="btn">

Continue

</a>


</div>

</section>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


    const API =
        "https://smart-vehicle-rental-platform-1.onrender.com/api";


    const params =
        new URLSearchParams(
            window.location.search
        );


    const vehicleId =
        params.get("id");


    const pickup =
        params.get("pickup");


    const ret =
        params.get("return");


    const pickupTime =
        params.get("pickupTime") || "";


    const returnTime =
        params.get("returnTime") || "";


    const pickupLocation =
        params.get("pickupLocation") || "";


    const returnLocation =
        params.get("returnLocation") || "";


    const vehicleNameEl =
        document.getElementById(
            "vehicleName"
        );


    const pickupEl =
        document.getElementById(
            "pickupDate"
        );


    const returnEl =
        document.getElementById(
            "returnDate"
        );


    const daysEl =
        document.getElementById(
            "totalDays"
        );


    const totalEl =
        document.getElementById(
            "totalAmount"
        );


    const continueBtn =
        document.getElementById(
            "continueBtn"
        );


    /*
        LOCAL VEHICLE DATA
    */

    const localVehicles = {

        "1": {
            name: "Mahindra Scorpio N",
            price: 4200,
            deposit: 10000
        },

        "3": {
            name: "Kia Seltos",
            price: 2700,
            deposit: 10000
        },

        "4": {
            name: "Hyundai Verna",
            price: 2300,
            deposit: 10000
        },

        "5": {
            name: "Honda City",
            price: 2200,
            deposit: 10000
        },

        "6": {
            name: "Tata Harrier",
            price: 3300,
            deposit: 10000
        },

        "7": {
            name: "Mahindra XUV700",
            price: 4500,
            deposit: 10000
        },

        "8": {
            name: "MG Hector",
            price: 3000,
            deposit: 10000
        },

        "9": {
            name: "Toyota Innova Hycross",
            price: 5200,
            deposit: 10000
        },

        "10": {
            name: "BMW X1",
            price: 8500,
            deposit: 20000
        },

        "11": {
            name: "Audi A4",
            price: 9000,
            deposit: 20000
        },

        "12": {
            name: "Mercedes C-Class",
            price: 10000,
            deposit: 20000
        },

        "13": {
            name: "Tata Nexon EV",
            price: 2800,
            deposit: 10000
        },

        "14": {
            name: "Royal Enfield Hunter 350",
            price: 850,
            deposit: 5000
        },

        "15": {
            name: "KTM Duke 390",
            price: 1200,
            deposit: 5000
        },

        "16": {
            name: "TVS Apache RTR 310",
            price: 950,
            deposit: 5000
        },

        "17": {
            name: "Honda CB350",
            price: 900,
            deposit: 5000
        },

        "18": {
            name: "Hero XPulse 200",
            price: 750,
            deposit: 5000
        },

        "19": {
            name: "Honda Activa 6G",
            price: 400,
            deposit: 5000
        },

        "20": {
            name: "Ola S1 Pro",
            price: 650,
            deposit: 5000
        },

        "21": {
            name: "MG ZS EV",
            price: 3500,
            deposit: 10000
        },

        "22": {
            name: "Hyundai Ioniq 5",
            price: 4800,
            deposit: 10000
        },

        "23": {
            name: "Land Rover Defender",
            price: 15000,
            deposit: 20000
        },

        "24": {
            name: "Ford Mustang",
            price: 18000,
            deposit: 20000
        },

        "25": {
            name: "Volkswagen Virtus",
            price: 2600,
            deposit: 10000
        }

    };


    const local =
        localVehicles[vehicleId];


    /*
        BASIC INFORMATION
    */

    pickupEl.textContent =
        pickup || "Not selected";


    returnEl.textContent =
        ret || "Not selected";


    if (local) {

        vehicleNameEl.textContent =
            local.name;

    }


    /*
        CALCULATE DAYS
    */

    let days = 0;


    if (pickup && ret) {

        const start =
            new Date(
                pickup + "T00:00:00"
            );


        const end =
            new Date(
                ret + "T00:00:00"
            );


        const difference =
            end - start;


        if (difference >= 0) {

            days =
                Math.max(
                    1,
                    Math.ceil(
                        difference /
                        86400000
                    )
                );

        }

    }


    if (days > 0) {

        daysEl.textContent =
            days +
            (days === 1
                ? " Day"
                : " Days");

    } else {

        daysEl.textContent =
            "Invalid dates";

    }


    /*
        LOCAL PRICE
    */

    let price =
        local
            ? local.price
            : 0;


    let deposit =
        local
            ? local.deposit
            : 0;


    if (local && days > 0) {

        const total =
            (days * price) +
            deposit;


        totalEl.textContent =
            "₹" +
            total.toLocaleString(
                "en-IN"
            );

    }


    /*
        GET REAL BACKEND DATA
    */

    if (vehicleId) {

        fetch(
            `${API}/vehicles/${encodeURIComponent(vehicleId)}`
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "API Error " +
                    response.status
                );

            }

            return response.json();

        })

        .then(vehicle => {

            const brand =
                vehicle.brand || "";


            const model =
                vehicle.model || "";


            const backendName =
                `${brand} ${model}`.trim();


            if (backendName) {

                vehicleNameEl.textContent =
                    backendName;

            }


            const backendPrice =
                Number(
                    vehicle.price_per_day
                );


            const backendDeposit =
                Number(
                    vehicle.security_deposit
                );


            if (backendPrice > 0) {

                price =
                    backendPrice;

            }


            if (backendDeposit > 0) {

                deposit =
                    backendDeposit;

            }


            if (days > 0 && price > 0) {

                const total =
                    (days * price) +
                    deposit;


                totalEl.textContent =
                    "₹" +
                    total.toLocaleString(
                        "en-IN"
                    );

            }

        })

        .catch(error => {

            console.warn(
                "Backend unavailable. Local data used.",
                error
            );

        });

    }


    /*
        CONTINUE BUTTON
    */

    if (
        vehicleId &&
        pickup &&
        ret &&
        days > 0
    ) {

        continueBtn.href =
            "booking-summary.html" +
            "?id=" +
            encodeURIComponent(vehicleId) +
            "&pickup=" +
            encodeURIComponent(pickup) +
            "&return=" +
            encodeURIComponent(ret) +
            "&pickupTime=" +
            encodeURIComponent(pickupTime) +
            "&returnTime=" +
            encodeURIComponent(returnTime) +
            "&pickupLocation=" +
            encodeURIComponent(pickupLocation) +
            "&returnLocation=" +
            encodeURIComponent(returnLocation);

    } else {

        continueBtn.href =
            "#";

    }


});

</script>


<script src="../assets/js/script.js"></script>

</body>

</html>
