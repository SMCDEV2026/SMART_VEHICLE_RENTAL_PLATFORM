<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Availability Check | DriveZone</title>

<link rel="stylesheet" href="../assets/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>
<script>

const API = "https://smart-vehicle-rental-platform-1.onrender.com/api";

const params = new URLSearchParams(window.location.search);

const vehicleId = params.get("id");

const pickup = params.get("pickup");

const ret = params.get("return");

async function loadBooking(){

    const res = await fetch(`${API}/vehicles/${vehicleId}`);

    const vehicle = await res.json();

    document.getElementById("vehicleName").innerHTML =
        vehicle.brand + " " + vehicle.model;

    document.getElementById("pickupDate").innerHTML = pickup;

    document.getElementById("returnDate").innerHTML = ret;

    const d1 = new Date(pickup);

    const d2 = new Date(ret);

    const days = Math.ceil((d2-d1)/(1000*60*60*24));

    document.getElementById("totalDays").innerHTML =
        days + " Days";

    const total =
        (days * vehicle.price_per_day) +
        vehicle.security_deposit;

    document.getElementById("totalAmount").innerHTML =
        "₹" + total.toLocaleString();

    document.getElementById("continueBtn").href =
        `booking-summary.html?id=${vehicleId}&pickup=${pickup}&return=${ret}`;

}

loadBooking();

</script>
<body>

<header>

<div class="logo">

<h2>DriveZone</h2>

</div>

<nav>

<a href="../index.html">Home</a>

<a href="vehicles.html">Vehicles</a>

<a href="my-bookings.html">My Bookings</a>

</nav>

</header>

<section class="availability-section">

<div class="availability-card">

<i class="fa-solid fa-circle-check success-icon"></i>

<h1>Vehicle Available</h1>

<p>

Great News! Your selected vehicle is available
for the selected dates.

</p>

<div class="booking-info">

<div>
<h3>Vehicle</h3>
<p id="vehicleName">Loading...</p>
</div>

<div>
<h3>Pickup Date</h3>
<p id="pickupDate">Loading...</p>
</div>

<div>
<h3>Return Date</h3>
<p id="returnDate">Loading...</p>
</div>

<div>
<h3>Total Days</h3>
<p id="totalDays">Loading...</p>
</div>

<div>
<h3>Total Amount</h3>
<p class="price" id="totalAmount">Loading...</p>
</div>

</div>

<a id="continueBtn" href="#" class="btn">

Continue

</a>

</div>

</section>

<script src="../assets/js/script.js"></script>

</body>

</html>
